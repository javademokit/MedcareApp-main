spring.application.name=payroll
server.port=8080
server.address=${PAYROLL_SERVER_ADDRESS:127.0.0.1}
server.error.include-message=always

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/payroll}
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

payroll.documents.storage-dir=${PAYROLL_DOCUMENT_STORAGE_DIR:${user.home}/.payroll-system/employee-documents}
payroll.documents.key-file=${PAYROLL_DOCUMENT_KEY_FILE:${user.home}/.payroll-system/employee-documents.key}
medcare.auth-api-base-url=${MEDCARE_AUTH_API_BASE_URL:http://localhost:7771/api}

# Time zone used by the month-end scheduler
payroll.timezone=Asia/Kolkata
