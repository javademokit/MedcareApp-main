spring.application.name=MedcareApp

server.port =7771
management.endpoints.web.exposure.include=health
spring.data.mongodb.uri=mongodb://localhost:27017/MedcareDB
spring.data.mongodb.database=MedcareDB
spring.data.mongodb.auto-index-creation=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
ambulance.rate-per-kilometer=${AMBULANCE_RATE_PER_KILOMETER:100}

# Initial administrator bootstrap is disabled unless explicitly enabled.
# Supply the credentials through environment variables, never in this file.
app.security.bootstrap-admin.enabled=${APP_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.user-id=${APP_SECURITY_BOOTSTRAP_ADMIN_USER_ID:admin}
app.security.bootstrap-admin.email=${APP_SECURITY_BOOTSTRAP_ADMIN_EMAIL:admin@medcare.local}
app.security.bootstrap-admin.mobile=${APP_SECURITY_BOOTSTRAP_ADMIN_MOBILE:8095042235}
app.security.bootstrap-admin.password=${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:admin12345678}
app.security.bootstrap-admin.promote-existing-email=${APP_SECURITY_BOOTSTRAP_ADMIN_PROMOTE_EXISTING_EMAIL:}

# Optional staff accounts are created on startup when their passwords are supplied.
# Keep passwords in environment variables instead of committing credentials here.
app.security.bootstrap-staff.enabled=${APP_SECURITY_BOOTSTRAP_STAFF_ENABLED:true}
app.security.bootstrap-staff.accounts.pharmacist.user-id=${APP_BOOTSTRAP_PHARMACIST_USER_ID:pharmacy}
app.security.bootstrap-staff.accounts.pharmacist.email=${APP_BOOTSTRAP_PHARMACIST_EMAIL:pharmacy@medcare.local}
app.security.bootstrap-staff.accounts.pharmacist.mobile=${APP_BOOTSTRAP_PHARMACIST_MOBILE:}
app.security.bootstrap-staff.accounts.pharmacist.password=${APP_BOOTSTRAP_PHARMACIST_PASSWORD:}
app.security.bootstrap-staff.accounts.doctor.user-id=${APP_BOOTSTRAP_DOCTOR_USER_ID:doctor}
app.security.bootstrap-staff.accounts.doctor.email=${APP_BOOTSTRAP_DOCTOR_EMAIL:doctor@medcare.local}
app.security.bootstrap-staff.accounts.doctor.mobile=${APP_BOOTSTRAP_DOCTOR_MOBILE:}
app.security.bootstrap-staff.accounts.doctor.password=${APP_BOOTSTRAP_DOCTOR_PASSWORD:}
app.security.bootstrap-staff.accounts.doctor.doctor-profile.name=${APP_BOOTSTRAP_DOCTOR_NAME:Doctor Account}
app.security.bootstrap-staff.accounts.doctor.doctor-profile.specialty=${APP_BOOTSTRAP_DOCTOR_SPECIALTY:General medicine}
app.security.bootstrap-staff.accounts.doctor.doctor-profile.destination=${APP_BOOTSTRAP_DOCTOR_DESTINATION:}
app.security.bootstrap-staff.accounts.doctor.doctor-profile.available-times=${APP_BOOTSTRAP_DOCTOR_AVAILABLE_TIMES:}
app.security.bootstrap-staff.accounts.doctor.doctor-profile.consultation-fee=${APP_BOOTSTRAP_DOCTOR_CONSULTATION_FEE:0}
app.security.bootstrap-staff.accounts.nurse.user-id=${APP_BOOTSTRAP_NURSE_USER_ID:nurse}
app.security.bootstrap-staff.accounts.nurse.email=${APP_BOOTSTRAP_NURSE_EMAIL:nurse@medcare.local}
app.security.bootstrap-staff.accounts.nurse.mobile=${APP_BOOTSTRAP_NURSE_MOBILE:}
app.security.bootstrap-staff.accounts.nurse.password=${APP_BOOTSTRAP_NURSE_PASSWORD:}
app.security.bootstrap-staff.accounts.technician.user-id=${APP_BOOTSTRAP_TECHNICIAN_USER_ID:technician}
app.security.bootstrap-staff.accounts.technician.email=${APP_BOOTSTRAP_TECHNICIAN_EMAIL:technician@medcare.local}
app.security.bootstrap-staff.accounts.technician.mobile=${APP_BOOTSTRAP_TECHNICIAN_MOBILE:}
app.security.bootstrap-staff.accounts.technician.password=${APP_BOOTSTRAP_TECHNICIAN_PASSWORD:}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.mongodb.driver=INFO

twilio.account.sid=your_account_sid
twilio.auth.token=your_auth_token
twilio.phone.number=+1415XXXXXXX
