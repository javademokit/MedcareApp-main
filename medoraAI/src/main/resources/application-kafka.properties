# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=placeholder@example.com
spring.mail.password=placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS
notification.sms.provider=mock

# Retry topics
spring.kafka.retrytopic.retrytopic-multiplier=2
spring.kafka.retrytopic.dlt-backoff=10000
spring.kafka.retrytopic.max-attempts=3
spring.kafka.retrytopic.initial-delay=1000
spring.kafka.retrytopic.max-delay=10000
